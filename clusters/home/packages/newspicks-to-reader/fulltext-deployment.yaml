apiVersion: apps/v1
kind: Deployment
metadata:
  name: newspicks-to-reader-fulltext
  namespace: newspicks-to-reader
  labels:
    app.kubernetes.io/name: newspicks-to-reader
    app.kubernetes.io/component: fulltext
spec:
  replicas: 1
  # 1 ブラウザ・1 記事ずつ処理する。並列化すると bot 判定が上がるので Recreate で固定する。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: newspicks-to-reader
      app.kubernetes.io/component: fulltext
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newspicks-to-reader
        app.kubernetes.io/component: fulltext
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fulltext
          image: ghcr.io/tauto1127/newspicks-to-reader:0.1.0@sha256:265d6c106b46c956a5373087f679e987fcbe163694f7bc19ea8038ca69cd53b2
          imagePullPolicy: IfNotPresent
          # このイメージの Chromium は X が無いと起動できないため、仮想ディスプレイ配下で動かす。
          command:
            - xvfb-run
            - -a
            - --server-args=-screen 0 1280x1024x24
            - python
            - fulltext.py
            - --serve
            - --port
            - "8790"
          ports:
            - name: http
              containerPort: 8790
          env:
            - name: NP2R_PROFILE
              value: /data/profile
            - name: NP2R_HEADLESS
              value: "1"
            - name: NP2R_LOGIN_CDP_PORT
              value: "9222"
            - name: NP2R_FULLTEXT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: newspicks-to-reader-secrets
                  key: NP2R_FULLTEXT_TOKEN
          volumeMounts:
            - name: profile
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "2"
              memory: 3Gi
            requests:
              cpu: 200m
              memory: 768Mi
      volumes:
        - name: profile
          persistentVolumeClaim:
            claimName: newspicks-to-reader-profile
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
