apiVersion: apps/v1
kind: Deployment
metadata:
  name: newspicks-to-reader-fulltext
  namespace: newspicks-to-reader
  labels:
    app.kubernetes.io/name: newspicks-to-reader
    app.kubernetes.io/component: fulltext
spec:
  replicas: 1
  # 永続プロファイルを同時に開かないよう、更新時も Pod を 1 つに保つ。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: newspicks-to-reader
      app.kubernetes.io/component: fulltext
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newspicks-to-reader
        app.kubernetes.io/component: fulltext
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fulltext
          image: ghcr.io/tauto1127/newspicks-to-reader:0.1.0@sha256:4755c32c83155f5a3ab0bd273fd87c8d71cee1d50a6f1335d186a765235ba5a8
          imagePullPolicy: IfNotPresent
          command:
            - python
            - fulltext.py
            - --serve
            - --port
            - "8790"
          ports:
            - name: http
              containerPort: 8790
          env:
            - name: NP2R_PROFILE
              value: /data/profile
            - name: NP2R_HEADLESS
              value: "1"
            - name: NP2R_FULLTEXT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: newspicks-to-reader-secrets
                  key: NP2R_FULLTEXT_TOKEN
          volumeMounts:
            - name: profile
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "2"
              memory: 3Gi
            requests:
              cpu: 200m
              memory: 768Mi
      volumes:
        - name: profile
          persistentVolumeClaim:
            claimName: newspicks-to-reader-profile
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
