apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: newspicks-to-reader-secrets
  namespace: newspicks-to-reader
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store-provider
  target:
    name: newspicks-to-reader-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: READWISE_TOKEN
      remoteRef:
        key: newspicks-to-reader-readwise-token
        version: latest
    - secretKey: NP2R_HOME_TOKEN
      remoteRef:
        key: newspicks-to-reader-home-token
        version: latest
    - secretKey: NP2R_FULLTEXT_TOKEN
      remoteRef:
        key: newspicks-to-reader-fulltext-token
        version: latest
