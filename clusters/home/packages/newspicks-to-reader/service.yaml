apiVersion: v1
kind: Service
metadata:
  name: newspicks-to-reader-ingest
  namespace: newspicks-to-reader
  labels:
    app.kubernetes.io/name: newspicks-to-reader
    app.kubernetes.io/component: ingest
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8787
      targetPort: http
  selector:
    app.kubernetes.io/name: newspicks-to-reader
    app.kubernetes.io/component: ingest
---
apiVersion: v1
kind: Service
metadata:
  name: newspicks-to-reader-fulltext
  namespace: newspicks-to-reader
  labels:
    app.kubernetes.io/name: newspicks-to-reader
    app.kubernetes.io/component: fulltext
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8790
      targetPort: http
  selector:
    app.kubernetes.io/name: newspicks-to-reader
    app.kubernetes.io/component: fulltext
