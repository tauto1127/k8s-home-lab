apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-external-secrets
  namespace: grafana
spec:
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: grafana-external-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: grafana
      remoteRef:
        key: grafana/password
        decodingStrategy: None
