apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
  annotations:
    flux.takutk.com/activation-blocked: "true"
spec:
  interval: 30m
  timeout: 10m
  suspend: true
  releaseName: nextcloud
  chart:
    spec:
      chart: nextcloud
      version: 9.1.3
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: true
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  uninstall:
    keepHistory: true
  values:
    image:
      repository: docker.io/library/nextcloud
      tag: 33.0.10-apache@sha256:ca04a99f5a081030dd6c494bdfbb1cbc2bf3e2e10c0f9fcdc3be031ac3803f77
    nextcloud:
      existingSecret:
        enabled: true
        secretName: nextcloud-db-secret
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
