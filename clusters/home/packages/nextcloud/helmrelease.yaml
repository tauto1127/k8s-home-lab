apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
  annotations:
    flux.takutk.com/activation-blocked: "true"
spec:
  interval: 30m
  timeout: 10m
  suspend: true
  releaseName: nextcloud
  chart:
    spec:
      chart: nextcloud
      version: 9.1.3
      sourceRef:
        kind: HelmRepository
        name: nextcloud
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: true
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  uninstall:
    keepHistory: true
  values:
    image:
      repository: docker.io/library/nextcloud
      tag: 35.0.2-apache@sha256:b2de54764f1ce7d47d221536f72af93567116420d6c06cfc16bccf55b0403fbe
    replicaCount: 1
    nextcloud:
      existingSecret:
        enabled: true
        secretName: nextcloud-db-secret
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
