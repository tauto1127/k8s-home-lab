apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trek
  namespace: trek
  annotations:
    flux.takutk.com/activation-blocked: "true"
spec:
  interval: 30m
  timeout: 10m
  suspend: true
  releaseName: trek
  targetNamespace: trek
  storageNamespace: trek
  chart:
    spec:
      chart: trek
      version: 4.2.1
      sourceRef:
        kind: HelmRepository
        name: trek
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    crds: Skip
    disableTakeOwnership: true
    remediation:
      retries: 0
  upgrade:
    crds: Skip
    disableTakeOwnership: true
    remediation:
      retries: 0
      remediateLastFailure: false
  uninstall:
    keepHistory: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: trek
            patch: |-
              - op: add
                path: /metadata/annotations
                value:
                  konghq.com/connect-timeout: "60000"
                  konghq.com/read-timeout: "86400000"
                  konghq.com/write-timeout: "86400000"
  values:
    image:
      repository: mauriceboe/trek
      tag: "4.2.1@sha256:777f4d647e973fe7d87fecd957e854b86d57e8d977fd041763e0ca19b3c2e2c0"
      pullPolicy: IfNotPresent
    updateStrategy: Recreate
    service:
      type: ClusterIP
      port: 3000
    env:
      APP_URL: https://trek.takutk.com
      ALLOWED_ORIGINS: https://trek.takutk.com
      TRUST_PROXY: "2"
      FORCE_HTTPS: "false"
      TZ: Asia/Tokyo
    existingSecret: trek-secrets
    existingSecretKey: ENCRYPTION_KEY
    secretEnv: {}
    generateEncryptionKey: false
    persistence:
      enabled: true
      data:
        size: 5Gi
        storageClassName: nfs-client
        annotations:
          helm.sh/resource-policy: keep
      uploads:
        size: 20Gi
        storageClassName: nfs-client
        annotations:
          helm.sh/resource-policy: keep
    ingress:
      enabled: true
      className: kong
      annotations:
        konghq.com/strip-path: "false"
      hosts:
        - host: trek.takutk.com
          paths:
            - /
      tls: []
