apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  timeout: 5m
  suspend: true
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 0.14.4
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: true
    remediation:
      retries: 0
    disableWait: false
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
  uninstall:
    keepHistory: true
  values:
    installCRDs: true
