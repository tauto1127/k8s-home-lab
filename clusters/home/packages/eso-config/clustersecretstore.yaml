apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secret-store-provider
spec:
  provider:
    gcpsm:
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: gcpsm-secret
            key: secret-access-credentials
            namespace: gcpsm-secret
      projectID: "269357193809"
---
# 1Password (Service Account / SDK). Requires Secret external-secrets/onepassword-sa-token (created manually, not in Git).
# remoteRef.key format: "<item>/<field>"
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: home-lab
      auth:
        serviceAccountSecretRef:
          name: onepassword-sa-token
          key: token
          namespace: external-secrets
