# Jellyfin /config on the worker's local disk.
# SQLite (WAL) on NFS stalled /health for 30s+ several times a day, so the config
# moves off NFS. The single worker runs all workloads; nodeAffinity pins the volume there.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config-local-pv
  labels:
    app: jellyfin
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: jellyfin-local
  hostPath:
    path: /var/lib/jellyfin/config
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-node-2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-local
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: jellyfin-local
  volumeName: jellyfin-config-local-pv
