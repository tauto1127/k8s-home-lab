renderedSecretExceptions:
  - sourcePath: apps/dashboard/helmfile.yaml
    namespace: default
    kind: Secret
    name: kubernetes-dashboard-csrf
    allowedKeys:
      - private.key
    reason: The pinned Dashboard chart generates its CSRF signing key during Helm rendering; replace the retired chart before Flux migration.
  - sourcePath: apps/dashboard/helmfile.yaml
    namespace: kong
    kind: Secret
    name: kong-kong-validation-webhook-ca-keypair
    allowedKeys:
      - tls.crt
      - tls.key
    reason: The pinned Kong chart generates a CA keypair for its validation webhook during Helm rendering.
  - sourcePath: apps/dashboard/helmfile.yaml
    namespace: kong
    kind: Secret
    name: kong-kong-validation-webhook-keypair
    allowedKeys:
      - tls.crt
      - tls.key
    reason: The pinned Kong chart generates a serving keypair for its validation webhook during Helm rendering.
  - sourcePath: middlewares/grafana/helmfile.yaml
    namespace: grafana
    kind: Secret
    name: grafana-cloud-logs-grafana-k8s-monitoring
    allowedKeys:
      - username
    reason: The pinned Grafana chart stores a non-secret connection username beside externally sourced credentials.
  - sourcePath: middlewares/grafana/helmfile.yaml
    namespace: grafana
    kind: Secret
    name: grafana-cloud-metrics-grafana-k8s-monitoring
    allowedKeys:
      - username
    reason: The pinned Grafana chart stores a non-secret connection username beside externally sourced credentials.
  - sourcePath: middlewares/grafana/helmfile.yaml
    namespace: grafana
    kind: Secret
    name: grafana-cloud-otlp-endpoint-grafana-k8s-monitoring
    allowedKeys:
      - username
    reason: The pinned Grafana chart stores a non-secret connection username beside externally sourced credentials.
  - sourcePath: middlewares/pg-operator/kustomization.yaml
    namespace: pg-operator
    kind: Secret
    name: plugin-barman-cloud-2b4mtt7m69
    allowedKeys:
      - SIDECAR_IMAGE
    reason: Upstream Barman Cloud plugin uses a generated non-credential Secret for its sidecar image configuration.
