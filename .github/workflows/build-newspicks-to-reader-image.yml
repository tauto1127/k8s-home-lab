name: build-newspicks-to-reader-image

on:
  pull_request:
    paths:
      - containers/newspicks-to-reader/**
  push:
    branches:
      - main
    paths:
      - containers/newspicks-to-reader/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-newspicks-to-reader-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/tauto1127/newspicks-to-reader

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d1423972ebc626ab1f20198e53c9e9b6a4e1 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: containers/newspicks-to-reader
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:0.1.0
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
