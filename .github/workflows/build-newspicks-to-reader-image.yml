name: build-newspicks-to-reader-image

on:
  pull_request:
    paths:
      - containers/newspicks-to-reader/**
      - .github/workflows/build-newspicks-to-reader-image.yml
  push:
    branches:
      - main
    paths:
      - containers/newspicks-to-reader/**
      - .github/workflows/build-newspicks-to-reader-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-newspicks-to-reader-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/tauto1127/newspicks-to-reader

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test article extraction and delivery
        working-directory: containers/newspicks-to-reader
        run: python3 -m unittest -v test_article_delivery

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/newspicks-to-reader
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:0.1.0
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
