apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskschuter-mcp-cloudflared
  namespace: taskschuter-mcp
  labels:
    app.kubernetes.io/name: taskschuter-mcp-cloudflared
    app.kubernetes.io/part-of: taskschuter-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskschuter-mcp-cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskschuter-mcp-cloudflared
        app.kubernetes.io/part-of: taskschuter-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.3
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --url
            - http://taskschuter-mcp.taskschuter-mcp.svc.cluster.local:8080
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: taskschuter-mcp-tunnel
                  key: TUNNEL_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
