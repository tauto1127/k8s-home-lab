repositories:
- name: nextcloud
  url: https://nextcloud.github.io/helm/

releases:
- name: nextcloud
  namespace: nextcloud
  chart: nextcloud/nextcloud
  version: 9.1.3
  values:
  - image:
      tag: "35.0.2-apache@sha256:b2de54764f1ce7d47d221536f72af93567116420d6c06cfc16bccf55b0403fbe"
    replicaCount: 1
    nextcloud:
      existingSecret:
        enabled: true
        secretName: nextcloud-db-secret
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
