repositories:
- name: nextcloud
  url: https://nextcloud.github.io/helm/

releases:
- name: nextcloud
  namespace: nextcloud
  chart: nextcloud/nextcloud
  version: 9.1.3
  values:
  - image:
      tag: "33.0.10-apache@sha256:ca04a99f5a081030dd6c494bdfbb1cbc2bf3e2e10c0f9fcdc3be031ac3803f77"
    nextcloud:
      existingSecret:
        enabled: true
        secretName: nextcloud-db-secret
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
