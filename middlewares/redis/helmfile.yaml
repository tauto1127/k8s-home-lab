# redis-master.redis.svc.cluster.localでアクセス
repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: redis
    namespace: redis
    chart: bitnami/redis
    version: "23.1.3"
    createNamespace: true
    values:
      - global:
          storageClass: "nfs-client"
        image:
          # Pin the image currently running in the cluster; chart 23.1.3
          # otherwise defaults to the mutable `latest` tag.
          digest: sha256:08863c2c3f4e051fb6139b38fa223e9c13be5033326a59bead182860d899bf98
        auth:
          enabled: false 
        replica:
          replicaCount: 0
      
